{% extends "mainapp/base.html" %}

{% block title %}Login{% endblock %}

{% block body_block %}
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>

        {% if error %}
        <p style="color: red;">{{ error }}</p>
        {% endif %}
    </form>
    <p>Don't have an account? <a href="{% url 'mainapp:register' %}">Register here</a>.</p>
{% endblock %}
