<!-- templates/mainapp/edit_thought.html -->
{% extends "mainapp/base.html" %}

{% block title %}Edit Morning Thought{% endblock %}

{% block body_block %}
    <h1>Edit Your Morning Thought</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save changes</button>
    </form>

    <br>
    <a href="{% url 'mainapp:profile' %}">Back to Profile</a>
{% endblock %}
