{% extends "mainapp/base.html" %}

{% block title %}Registration{% endblock %}

{% block body_block %}
    <h1>Register</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'mainapp:user_login' %}">Login here</a>.</p>
{% endblock %}
